name: maka_admin
description: 玛卡之声社区 管理面板
publish_to: 'none'
version: 0.26.9+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  audioplayers: ^6.1.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#EF4444"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
