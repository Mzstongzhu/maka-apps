name: makacommunity
description: 玛卡之声社区 - 社区浏览、私信收发与通知
publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.0.2
  socket_io_client: ^2.0.1
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#3B82F6"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
