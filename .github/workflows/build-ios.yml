name: build-ios-unsigned

# 手动触发，或推送 ios-* 标签时触发并发布到 GitHub Releases（预发布）
on:
  workflow_dispatch:
  push:
    tags: ['ios-*']

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: community
            project: makacommunity
            bundle: xyz.makazs.maka
            display: 玛卡之声社区
            artifact: maka-community-ios-unsigned
          - dir: admin
            project: maka_admin
            bundle: xyz.makazs.makaadmin
            display: 玛卡管理面板
            artifact: maka-admin-ios-unsigned

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS runner
        working-directory: ${{ matrix.dir }}
        run: |
          rm -rf /tmp/iosboot
          flutter create --platforms=ios --project-name "${{ matrix.project }}" --org xyz.makazs /tmp/iosboot
          cp -R /tmp/iosboot/ios ./ios

      - name: Patch Info.plist
        working-directory: ${{ matrix.dir }}
        run: |
          set -e
          PLIST=ios/Runner/Info.plist
          PB=/usr/libexec/PlistBuddy
          $PB -c "Add :NSPhotoLibraryUsageDescription string 用于选择头像与动态配图" "$PLIST"
          $PB -c "Add :NSCameraUsageDescription string 用于拍摄头像与动态配图" "$PLIST"
          $PB -c "Set :CFBundleDisplayName '${{ matrix.display }}'" "$PLIST" 2>/dev/null \
            || $PB -c "Add :CFBundleDisplayName string '${{ matrix.display }}'" "$PLIST"

      - name: Set bundle identifier
        working-directory: ${{ matrix.dir }}
        run: |
          sed -i.bak "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${{ matrix.bundle }};/g" \
            ios/Runner.xcodeproj/project.pbxproj
          grep PRODUCT_BUNDLE_IDENTIFIER ios/Runner.xcodeproj/project.pbxproj | head -3

      - name: Dependencies & icons
        working-directory: ${{ matrix.dir }}
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build (no code signing)
        working-directory: ${{ matrix.dir }}
        run: flutter build ios --release --no-codesign

      - name: Pack unsigned IPA
        working-directory: ${{ matrix.dir }}
        run: |
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry "${{ matrix.artifact }}.ipa" Payload
          ls -lh "${{ matrix.artifact }}.ipa"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dir }}/build/ios/iphoneos/${{ matrix.artifact }}.ipa
          retention-days: 30

      - name: Create prerelease
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --prerelease \
            --title "iOS 未签名测试包 $GITHUB_REF_NAME" \
            --notes "未签名 IPA，需自行签名安装（见 README）。最低系统：iOS 15+。" || true

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "${{ matrix.dir }}/build/ios/iphoneos/${{ matrix.artifact }}.ipa" --clobber
